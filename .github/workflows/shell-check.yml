name: Shell checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: |
          while IFS= read -r script; do
            bash -n "$script"
          done < <(find . -type f -name '*.sh' -not -path './.git/*')
      - name: Run release checks
        run: bash tests/release_check.sh
      - name: Build and verify release package
        run: |
          bash deploy/release_build.sh
          PKG="releases/tg_bot-v$(tr -d ' \r\n' < VERSION).tar.gz"
          TMP="$(mktemp -d)"
          tar -xzf "$PKG" -C "$TMP"
          bad=0
          while IFS= read -r -d '' f; do
            if ! tr -d '\0' < "$f" | cmp -s - "$f"; then
              continue
            fi
            if ! tr -d '\r' < "$f" | cmp -s - "$f"; then
              echo "::error::CRLF line endings found in packaged file: $f"
              bad=1
            fi
          done < <(find "$TMP" -type f -print0)
          exit "$bad"
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .
          severity: error
